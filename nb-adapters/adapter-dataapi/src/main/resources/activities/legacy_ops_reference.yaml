        # dimensions: 1024
        #### optional similarity function for vector (case-insensitive "COSINE"/"EUCLIDEAN"/"DOT_PRODUCT"):
        # similarity: DOT_PRODUCT
        #### optional (required for vectorize) service provider:
        # serviceProvider: voyageAI
        #### optional (required for vectorize) service model (note a typo, 'mode'):
        # serviceMode: voyage-2
        #### optional KMS secret name for vectorize API key:
        # serviceSharedSecretKey: SHARED_SECRET_EMBEDDING_API_KEY_VOYAGEAI
        #### optional parameters map for vectorize service/model:
        # serviceParameters:
        #   autoTruncate: true
        #### optional default ID type (case-sensitive "objectId"/"uuidv6"/"uuidv7"/"uuid"):
        # collectionType: objectId
        #### optional, allow-list for indexing (error if denyIndex present as well):
        # allowIndex:
        #   - aField1
        #   - aField2
        #### optional, deny-list for indexing (error if allowIndex present as well):
        # denyIndex:
        #   - aField1
        #   - aField2

