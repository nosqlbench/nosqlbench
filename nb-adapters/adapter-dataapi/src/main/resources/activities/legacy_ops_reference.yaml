        #   # concurrency level for running chunk insertions (must be 1 if ordered=true):
        #   concurrency: "5"
        #   # ordered insertion? true = insert sequentially and fail fast; false = no order guarantees, proceed even if errors:
        #   ordered: "false"
        #   # timeout for each individual chunk insertion (milliseconds):
        #   timeout: "5000"

