min_version: "5.25"

description: |
  Remote vector dataset access with a live download meter. No database
  required — this uses the stdout driver, so the only thing exercised is
  dataset access itself.

    nb5 vectordata_demo dataset=<name>:<profile>

  Point it at a catalog first, either of these:

    export VECTORDATA_CATALOG='https://your.host/path/catalog.yaml'
    nb5 vectordata_demo dataset=<name>:<profile> -Dvectordata.catalog=<url>

  Everything the workload needs is read from the dataset itself when the
  file loads — dimensions, record counts, k, and the similarity function
  come from the data rather than from parameters you have to restate.

    dataset:       {{spec == paramOr('dataset','MISSING-dataset-parameter')}}
    records:       {{records == paramOr('records','20000') as Long}}
    prefetch:      {{prefetchMode == paramOr('prefetch','load')}}
  {{= spec == 'MISSING-dataset-parameter' ? '  (pass dataset=<name>:<profile> to derive the rest from a dataset)' :
      '  dimensions:    ' + baseVectors(spec).dimension() + '\n' +
      '    base records:  ' + baseVectors(spec).count() + '\n' +
      '    query records: ' + queryVectors(spec).count() + '\n' +
      '    neighbors k:   ' + neighborIndices(spec).dimension() + '\n' +
      '    similarity:    ' + dataset(spec).attributes().getOrDefault('distance_function','unspecified')}}

  The demo reads the first `records` ordinals of the base facet, and
  `prefetch` chooses which prefetch call fetches them. Both fetching
  forms report the same way — the plan is announced, progress is metered
  while the bytes move, and completion is confirmed, all on stderr:

    prefetch=load        prefetchCycles(...) — fetches before the run
                         starts, so cycle 0 reads warm data. Blocks
                         until resident. This is the default.
    prefetch=background  prefetchCyclesBackground(...) — returns a
                         handle immediately and fetches while the cycles
                         run, so reads and the download overlap.
                         Progress is polled from the handle. Give it
                         enough cycles to outlast the download, or the
                         run ends first and the fetch stops partway.
    prefetch=none        no warm-up; reads demand-page whatever they
                         touch. Nothing to meter, so it stays quiet.

  {{= spec == 'MISSING-dataset-parameter' ? '  warm-up: skipped (no dataset given)' :
      prefetchMode == 'load' ? '  warm-up: fetched ' + prefetchCycles(spec,'base_vectors',0,records).rangesFetched() + ' range(s) before the run' :
      prefetchMode == 'background' ? '  warm-up: started in the background, ' + prefetchCyclesBackground(spec,'base_vectors',0,records).plan().requests() + ' range(s) planned' :
      '  warm-up: none, reads demand-page'}}

  Two ways to watch it:

    # fetch up front, then read — the meter runs before any cycles
    nb5 vectordata_demo dataset=<name>:<profile>

    # fetch during the run — a large range and enough cycles to see it
    nb5 vectordata_demo dataset=<name>:<profile> \
      prefetch=background records=100000 cycles=200

  Parameters: dataset (required), cycles (default 3), records (default
  20000), prefetch (load|background|none, default load). The meter only
  speaks when there are bytes to move, so a second run against a warm
  cache is silent by design — point VECTORDATA_HOME at an empty
  directory to watch it fetch again.

scenarios:
  default: >-
    run driver=stdout format=readout cycles=TEMPLATE(cycles,3) threads=1

bindings:
  cycle: Identity()
  # Reads are demand-paged here on purpose: the prefetch above is what
  # warms the data, so the meter has one owner and this window only
  # clips what the bindings expose.
  base_vector: BaseVectors('{{@spec}}','[0..{{@records}})','none'); Stringify()
  query_vector: QueryVectors('{{@spec}}',false); Stringify()
  neighbor_indices: NeighborIndices('{{@spec}}',false); Stringify()
